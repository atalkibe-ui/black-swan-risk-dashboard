limit_req_zone $binary_remote_addr zone=black_swan_ai:10m rate=2r/m;

upstream black_swan_dashboard {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name black-swan.bank.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name black-swan.bank.local;

    ssl_certificate /etc/pki/tls/certs/black-swan-dashboard.crt;
    ssl_certificate_key /etc/pki/tls/private/black-swan-dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;

    # Подключите здесь утвержденный банком модуль SSO/OIDC/Kerberos.
    # До подключения SSO публикация должна быть ограничена сетевым ACL.

    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://black_swan_dashboard;
    }

    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://black_swan_dashboard;
    }

    location = /api/ai-analysis {
        limit_req zone=black_swan_ai burst=3 nodelay;
        proxy_pass http://black_swan_dashboard;
    }

    location / {
        proxy_pass http://black_swan_dashboard;
    }
}
